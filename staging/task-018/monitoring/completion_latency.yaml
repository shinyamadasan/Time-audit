# gcloud logging metrics create completion_latency --project=STAGING_PROJECT_ID --config-from-file=completion_latency.yaml
description: TASK-018 handler latency (ms, includes token verification and RTDB I/O) by op.
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="chronasensecompletionapi" AND jsonPayload.component="chronasense-completion-api" AND jsonPayload.event="completion-request"'
valueExtractor: EXTRACT(jsonPayload.latencyMs)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
  - { key: op, valueType: STRING }
labelExtractors:
  op: EXTRACT(jsonPayload.op)
bucketOptions:
  exponentialBuckets: { numFiniteBuckets: 20, growthFactor: 1.6, scale: 50 }
