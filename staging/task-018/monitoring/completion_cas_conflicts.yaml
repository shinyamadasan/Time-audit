# gcloud logging metrics create completion_cas_conflicts --project=STAGING_PROJECT_ID --config-from-file=completion_cas_conflicts.yaml
description: TASK-018 412 conditional-write conflicts per mutate (distribution 0..3; 3 = retry bound reached).
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="chronasensecompletionapi" AND jsonPayload.component="chronasense-completion-api" AND jsonPayload.event="completion-request" AND jsonPayload.op="mutate"'
valueExtractor: EXTRACT(jsonPayload.casConflicts)
metricDescriptor: { metricKind: DELTA, valueType: DISTRIBUTION }
bucketOptions:
  explicitBuckets: { bounds: [0.5, 1.5, 2.5] }
