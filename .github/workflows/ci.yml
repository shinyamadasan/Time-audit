name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The accounting release suite: 442 mandatory cases plus the F1, start-stamp, pass-through, timeout and first-start upgrade specs (490).
  MANDATORY_SPECS: >-
    tests/accounting-account-successors.spec.js
    tests/accounting-focus-authority-v1.spec.js
    tests/accounting-qualification-closure.spec.js
    tests/accounting-same-end-qualification.spec.js
    tests/accounting-staged-effects.spec.js
    tests/accounting-undo-refusal-retry.spec.js
    tests/accounting-start-stamp.spec.js
    tests/accounting-status-passthrough.spec.js
    tests/accounting-timeout-diagnostics.spec.js
    tests/accounting-first-start-upgrade.spec.js
  MANDATORY_COUNT: 490
  # Every other browser spec (62 files). Only failures recorded in scripts/ci-known-failures.json are tolerated; they are reported.
  WIDER_COUNT: 1071
  # Release candidate (first-start fix on c8711f73): packaged web tree, Android bundle tree and Stage B rules.
  RELEASE_WEB_TREE: bf2443d9f1ee2b20d03ad223bca3b8e1678a9ea0f74248d2299885cc2c4e8cfc
  RELEASE_BUNDLE_TREE: 5ff0b43550193d85b8591afeb29bb9786c94a4268fb3a42046f49c2fad368e96
  RELEASE_RULES_SHA256: 93f0a77424e730aa5996825af4183e0d42d5f29251260b8f85eea3756645be00

jobs:
  # ---------------------------------------------------------------- required ----------------------------------------------------------------
  unit:
    name: Required / unit, lint, parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check www/ runtime parity
        run: npm run check:www-parity
      - name: Check firebase.rules.json is the builder's output
        run: npm run check:firebase-rules
      - name: Check functions shared copies
        run: npm run check:functions-shared
      - name: Lint
        run: npm run lint
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Unit and regression tests (npm test)
        run: npm test

  rules:
    name: Required / Firebase rules, fence and verifier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the installed-rules verifier test compares against origin/main's live rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - name: Provision the RTDB emulator (checksum-verified)
        run: npm run provision:rtdb-emulator
      - name: Rules emulator suites and installed-rules verifier
        run: node --test firebase-rules-emulator.test.js task-completion-emulator.test.js nudge-rules-emulator.test.js time-ack.test.js scripts/verify-installed-rules.test.js
      - name: Tombstone rules suite (4 superseded tests reported, not blocking)
        run: node scripts/ci-node-superseded.mjs entry-tombstone-rules-emulator.test.js
      - name: Real-SDK fence suites
        run: node --test brain-dump-fence-sdk.test.js online-planner-sdk.test.js
      - name: Entry reliability SDK suite (5 superseded tests reported, not blocking)
        run: node scripts/ci-node-superseded.mjs entry-reliability-sdk.test.js
      - name: Rules mutation suite
        run: node --test firebase-rules-mutation.test.js

  accounting:
    name: Required / accounting suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run provision:rtdb-emulator
      - name: Accounting specs (real SDK, emulator, one worker)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: accounting-${{ matrix.shard }}.json
        run: npx playwright test $MANDATORY_SPECS --workers=1 --forbid-only --shard=${{ matrix.shard }}/3 --reporter=list,json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-${{ matrix.shard }}
          path: accounting-${{ matrix.shard }}.json
          if-no-files-found: ignore

  accounting-count:
    name: Required / accounting suite ran 490 of 490
    needs: accounting
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: accounting-*
          merge-multiple: true
          path: reports
      - run: node scripts/ci-test-report.mjs required "$MANDATORY_COUNT" reports/*.json

  packaged:
    name: Required / packaged web and Android release bytes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packaged spec compares against the live rules at f73edd4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run provision:rtdb-emulator
      - name: Generate the Android project (android/ is not tracked)
        run: npx cap add android
      - name: Build the web and debug APK release bytes
        run: node scripts/build-release-artifacts.mjs --gradle-online --out .release-artifacts/ci
      - name: Release bytes equal the reviewed candidate
        run: |
          node -e '
            const m = require("./.release-artifacts/ci/release-manifest.json");
            const checks = { web: [m.web.tree, process.env.RELEASE_WEB_TREE],
              android: [m.android.bundleTree, process.env.RELEASE_BUNDLE_TREE], rules: [m.rulesSha256, process.env.RELEASE_RULES_SHA256] };
            let ok = true;
            for (const [name, [actual, expected]] of Object.entries(checks)) { console.log(name, actual, actual === expected ? "OK" : "MISMATCH"); ok &&= actual === expected; }
            console.log("apk", m.android.apkSha256, "(debug-signed on this runner; not the reviewed APK binary)");
            process.exit(ok ? 0 : 1);'
      - name: Packaged release spec
        env:
          CHRONASENSE_RELEASE_DIR: .release-artifacts/ci
          PLAYWRIGHT_JSON_OUTPUT_NAME: packaged.json
        run: npx playwright test tests/accounting-release-artifacts.spec.js --workers=1 --forbid-only --reporter=list,json
      - if: always()
        run: node scripts/ci-test-report.mjs required 62 packaged.json

  worker:
    name: Required / Conversational Read Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix workers/chronasense-conversational-bridge
      - run: npm test --prefix workers/chronasense-conversational-bridge
      - name: Bundle without deploying
        run: npm run check:bundle --prefix workers/chronasense-conversational-bridge

  release-gate:
    name: Required / release gate
    needs: [unit, rules, accounting, accounting-count, packaged, worker, regression, regression-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const bad = Object.entries(JSON.parse(process.env.NEEDS)).filter(([, job]) => job.result !== "success");
            for (const [name, job] of bad) console.log(`${name}: ${job.result}`);
            process.exit(bad.length ? 1 : 0);'

  regression:
    name: Required / wider browser suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run provision:rtdb-emulator
      - name: Every other browser spec; fails on any failure outside scripts/ci-known-failures.json
        run: node scripts/ci-run-wider.mjs ${{ matrix.shard }} 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wider-${{ matrix.shard }}
          path: wider-${{ matrix.shard }}.json
          if-no-files-found: ignore

  regression-report:
    name: Required / wider browser suite has no failure outside the recorded baseline
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wider-*
          merge-multiple: true
          path: reports
      - run: node scripts/ci-test-report.mjs legacy "$WIDER_COUNT" reports/*.json
